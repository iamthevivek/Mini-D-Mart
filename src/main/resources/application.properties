# =========================================================
# APPLICATION & SERVER
# =========================================================
spring.application.name=OneMart
server.port=${PORT:8080}

# =========================================================
# DATABASE (PostgreSQL Neon Cloud DB)
# =========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-patient-night-aygguvb8-pooler.c-5.us-east-2.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_0yLFrtZU9NeQ}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# H2 Console (available during development at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# DATABASE CONNECTION POOL
# =========================================================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}

# =========================================================
# JWT (Base64-encoded 256-bit secret)
# =========================================================
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS0yNTYtYml0LXNlY3JldC1rZXktZm9yLW1pbmktZG1hcnQtand0LXRva2VuLXNpZ25pbmc=}
jwt.issuer=${JWT_ISSUER:onemart-api}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =========================================================
# CORS & FRONTEND
# =========================================================
app.frontend-url=${FRONTEND_URL:http://localhost:5173,http://localhost:3000,http://localhost:8080}

# =========================================================
# OPENAPI / SWAGGER
# =========================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# =========================================================
# MAIL / SMTP CONFIGURATION
# =========================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${APP_MAIL_FROM:offers@onemart.com}
app.mail.sender-name=OneMart Supermarket